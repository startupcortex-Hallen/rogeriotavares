name: Deploy Flutter Web - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Instalar dependencias (flutter pub get)
        run: flutter pub get

      - name: Build de producao (flutter build web --release)
        run: flutter build web --release --base-href /

      - name: Upload do site (build/web)
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ativar GitHub Pages (idempotente)
        run: |
          gh api --method POST repos/${{ github.repository }}/pages \
            -f build_type=workflow --silent || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4