<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rogério Tavares • A Voz do Oeste</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1565C0;
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .num { font-size: 64px; font-weight: 900; color: #FFD600; }
    .msg { margin-top: 12px; font-size: 16px; opacity: .9; }
  </style>
  <script>
    // GitHub Pages nao conhece as rotas do Flutter (SPA com Path URL Strategy).
    // Quando alguem acessa /noticias diretamente (ou atualiza a pagina), o GitHub
    // retorna 404. Este arquivo salva o caminho pedido e recarrega a raiz;
    // o app Flutter le o caminho salvo e navega ate ele imediatamente.
    (function () {
      var path = location.pathname + location.search;
      if (path && path !== '/' && path !== '/index.html') {
        try {
          sessionStorage.setItem('redirect_path', path);
        } catch (e) { /* localStorage indisponivel: segue so com a raiz */ }
      }
      location.replace('/');
    })();
  </script>
</head>
<body>
  <div>
    <div class="num">45788</div>
    <div class="msg">Rogério Tavares • A Voz do Oeste — carregando...</div>
  </div>
</body>
</html>
