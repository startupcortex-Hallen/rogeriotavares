<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rogério Tavares • A Voz do Oeste</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1565C0;
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .num { font-size: 64px; font-weight: 900; color: #FFD600; }
    .msg { margin-top: 12px; font-size: 16px; opacity: .9; }
  </style>
  <script>
    // GitHub Pages não conhece as rotas do Flutter (SPA com Path URL Strategy).
    // Ao abrir/atualizar uma rota direta (ex.: /noticias), o GitHub responde 404
    // e serve este arquivo. Ele salva o caminho pedido em sessionStorage e sobe
    // os diretórios (./ ou ../) até achar o index.html — funciona no endereço
    // padrão github.io/rogeriotavares e também no domínio próprio (raiz "/").
    (function () {
      var prev = null, climbed = null, path = '';
      try {
        prev = sessionStorage.getItem('redirect_path');
        climbed = sessionStorage.getItem('redirect_climbed');
        path = location.pathname + location.search;
        if (climbed === path) {
          // Este nível já foi tentado e não é a raiz: sobe mais um diretório.
          sessionStorage.removeItem('redirect_climbed');
          location.replace('../');
          return;
        }
        if (prev !== path) {
          sessionStorage.setItem('redirect_path', path);
        }
        sessionStorage.setItem('redirect_climbed', path);
        location.replace('./');
      } catch (e) {
        location.replace('./');
      }
    })();
  </script>
</head>
<body>
  <div>
    <div class="num">45788</div>
    <div class="msg">Rogério Tavares • A Voz do Oeste — carregando...</div>
  </div>
</body>
</html>
